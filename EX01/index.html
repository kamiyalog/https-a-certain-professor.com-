<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f3f0e8">
  <title>オンライン呪物鑑定受付</title>
  <style>
    :root{
      --paper:#f3f0e8;--paper-2:#faf9f5;--ink:#25282b;--muted:#666c70;
      --line:#c9ccca;--line-dark:#777c7e;--red:#8a3434;--red-dark:#5f2024;
      --shadow:rgba(34,37,39,.08);--serif:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;
      --sans:"Yu Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif
    }
    *{box-sizing:border-box}
    html{min-height:100%;background:var(--paper)}
    body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--sans);letter-spacing:.04em;
      background:
        linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.15)),
        repeating-linear-gradient(0deg,rgba(49,52,53,.018) 0,rgba(49,52,53,.018) 1px,transparent 1px,transparent 4px),
        var(--paper);transition:background-color .5s,color .5s}
    button,a{font:inherit}
    button{color:inherit}
    a{color:inherit}
    .shell{width:min(1240px,calc(100% - 48px));margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
    .site-header{border-top:1px solid var(--line-dark);border-bottom:1px solid var(--line-dark);margin-top:16px;
      padding:17px 14px;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .brand{display:flex;align-items:center;gap:18px;min-width:0}
    .brand-mark{width:54px;height:54px;border:3px double #3e4b54;display:grid;place-items:center;
      font-family:var(--serif);font-size:24px;font-weight:700;color:#33434d;background:rgba(255,255,255,.25)}
    .brand-name{font-family:var(--serif);font-size:18px;font-weight:700;letter-spacing:.17em}
    .brand-sub{font-size:11px;color:var(--muted);margin-top:7px;letter-spacing:.14em}
    .doc-meta{font-family:monospace;font-size:10px;line-height:1.75;color:var(--muted);text-align:right;white-space:nowrap}
    .utility{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
    .text-button{border:0;background:transparent;padding:7px 10px;cursor:pointer;font-size:12px;color:var(--muted)}
    .text-button:hover,.text-button:focus-visible{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
    .menu-button{display:flex;align-items:center;gap:9px;border:1px solid transparent}
    .menu-icon{font-size:17px;line-height:1}
    main{flex:1;padding:54px 44px 70px;position:relative}
    .eyebrow{font-family:monospace;font-size:11px;color:var(--muted);letter-spacing:.16em;margin-bottom:18px}
    h1,h2,h3,p{margin-top:0}
    h1{font-family:var(--serif);font-weight:500;font-size:clamp(38px,5.7vw,76px);line-height:1.16;letter-spacing:.08em;margin-bottom:24px}
    h2{font-family:var(--serif);font-weight:600;font-size:clamp(26px,3vw,43px);letter-spacing:.08em}
    h3{font-family:var(--serif);font-weight:600}
    .lead{font-family:var(--serif);font-size:clamp(16px,1.8vw,22px);line-height:1.9;border-top:1px solid var(--line-dark);
      padding-top:25px;margin-bottom:30px}
    .rules{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin:28px 0 30px}
    .rule-card{border:1px solid var(--line-dark);background:rgba(255,255,255,.22);padding:26px 24px;min-height:132px;
      display:grid;grid-template-columns:52px 1fr;gap:18px;align-items:center}
    .rule-icon{font-family:var(--serif);font-size:30px;border-right:1px solid var(--line);height:66px;display:grid;place-items:center}
    .rule-card h3{font-size:22px;margin-bottom:10px}
    .rule-card p{font-size:12px;line-height:1.8;color:var(--muted);margin:0}
    .start-row{display:grid;grid-template-columns:minmax(280px,460px) 1fr;align-items:center;gap:50px}
    .primary{border:3px double #e7e5dd;background:#263139;color:#fff;padding:20px 28px;min-height:72px;cursor:pointer;
      font-family:var(--serif);font-size:22px;letter-spacing:.14em;display:flex;align-items:center;justify-content:space-between;
      box-shadow:0 5px 0 rgba(36,40,43,.12);transition:.16s ease}
    .primary:hover,.primary:focus-visible{background:#35434c;transform:translateY(-1px)}
    .primary:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(36,40,43,.12)}
    .registry-count{border-bottom:1px solid var(--line-dark);padding:12px 4px;font-family:var(--serif);font-size:17px}
    .stamp{position:absolute;right:35px;bottom:22px;transform:rotate(-9deg);border:3px double rgba(138,52,52,.58);
      color:rgba(138,52,52,.63);padding:9px 16px;font-family:var(--serif);font-weight:700;font-size:22px;letter-spacing:.16em}
    .portal-head{display:flex;justify-content:space-between;gap:30px;align-items:end;border-bottom:1px solid var(--line-dark);padding-bottom:22px;margin-bottom:28px}
    .progress{font-family:monospace;color:var(--muted);font-size:12px;white-space:nowrap}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
    .item-card{border:1px solid var(--line-dark);background:rgba(255,255,255,.28);padding:0;text-align:left;cursor:pointer;min-height:305px;
      display:flex;flex-direction:column;transition:.16s ease;position:relative;overflow:hidden}
    .item-card:hover,.item-card:focus-visible{transform:translateY(-3px);box-shadow:0 10px 28px var(--shadow);background:rgba(255,255,255,.48)}
    .item-card.done{opacity:.78}
    .thumb,.item-visual{background:
      linear-gradient(135deg,rgba(58,64,67,.06),rgba(255,255,255,.25)),
      repeating-linear-gradient(90deg,transparent 0,transparent 19px,rgba(49,53,55,.035) 20px);
      display:grid;place-items:center;position:relative;color:#717779}
    .thumb{height:176px;border-bottom:1px solid var(--line)}
    .thumb img,.item-visual img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 43%;display:block}
    .thumb.has-image,.item-visual.has-image{background:#171919}
    .item-visual.has-image:before{z-index:2;border-color:rgba(241,238,231,.42)}
    .item-visual.has-image .specimen-mark{z-index:3;color:#f1eee7;text-shadow:0 1px 4px rgba(0,0,0,.85)}
    .thumb-no{font-family:var(--serif);font-size:48px;letter-spacing:.08em;opacity:.55}
    .image-pending{position:absolute;bottom:10px;right:12px;font-family:monospace;font-size:9px;letter-spacing:.12em}
    .card-copy{padding:20px;flex:1}
    .card-copy h3{font-size:17px;line-height:1.55;margin-bottom:8px}
    .card-id{font-family:monospace;font-size:10px;color:var(--muted);margin-bottom:8px}
    .done-label{position:absolute;top:12px;right:10px;background:#2e383e;color:#fff;font-size:10px;padding:6px 10px;z-index:2}
    .unlock-note{margin-top:25px;padding:18px;border:1px dashed var(--line-dark);color:var(--muted);font-size:12px;text-align:center}
    .addition-note{margin:0 0 24px;border:1px solid var(--line-dark);background:rgba(255,255,255,.32);padding:15px 18px;
      display:flex;justify-content:space-between;align-items:center;gap:20px;font-family:var(--serif)}
    .addition-note strong{font-size:18px;font-weight:600}
    .addition-note span{font-family:monospace;font-size:12px;color:var(--red-dark);letter-spacing:.12em}
    .detail{max-width:980px;margin:0 auto}
    .back{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:0 0 18px;font-size:12px}
    .back:hover{text-decoration:underline;text-underline-offset:4px}
    .record-layout{display:grid;grid-template-columns:minmax(290px,42%) 1fr;gap:40px}
    .item-visual{min-height:420px;border:1px solid var(--line-dark);overflow:hidden}
    .item-visual:before{content:"";position:absolute;inset:18px;border:1px solid rgba(65,70,72,.24)}
    .visual-no{font-family:var(--serif);font-size:82px;opacity:.32}
    .specimen-mark{position:absolute;left:28px;top:28px;font-family:monospace;font-size:10px;letter-spacing:.18em}
    .detail-copy h1{font-size:clamp(32px,4vw,52px);margin-bottom:18px}
    .record-id{font-family:monospace;color:var(--muted);font-size:11px;border-bottom:1px solid var(--line);padding-bottom:13px;margin-bottom:24px}
    .story-text{white-space:pre-line;line-height:2;font-size:14px}
    .choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:28px}
    .choice{border:1px solid var(--line-dark);background:rgba(255,255,255,.22);padding:15px 10px;cursor:pointer;font-family:var(--serif);font-size:15px}
    .choice:hover,.choice:focus-visible{background:#303b42;color:#fff}
    .choice:disabled{cursor:not-allowed;opacity:.45}
    .result-box{margin-top:30px;border-top:1px solid var(--line-dark);padding-top:24px}
    .result-label{display:inline-block;border:1px solid var(--line-dark);padding:6px 10px;font-family:monospace;font-size:10px;margin-bottom:18px}
    .result-box.correct{color:#26372e}
    .result-box.failure{color:var(--red-dark)}
    .result-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
    .secondary{border:1px solid var(--line-dark);background:transparent;padding:13px 18px;cursor:pointer;font-size:12px}
    .secondary:hover,.secondary:focus-visible{background:#2d383e;color:#fff}
    .ending{max-width:830px;margin:35px auto;text-align:center}
    .ending-code{font-family:monospace;font-size:11px;color:var(--muted);letter-spacing:.18em;margin-bottom:30px}
    .ending h1{font-size:clamp(42px,6vw,78px)}
    .ending-copy{font-family:var(--serif);font-size:18px;line-height:2.2;white-space:pre-line;margin:36px auto;max-width:700px}
    .certificate{border:0;padding:clamp(68px,8vw,104px) clamp(38px,8vw,94px) clamp(86px,10vw,118px);
      min-height:min(830px,calc(100vw - 48px));background:#f6eedc url("assets/ending-certificate-paper.png") center/100% 100% no-repeat;
      color:#28251e;position:relative;display:flex;flex-direction:column;justify-content:center;
      box-shadow:0 18px 45px rgba(35,29,20,.2)}
    .certificate .ending-code{color:#6c6254}
    .certificate h1{font-size:clamp(36px,5.2vw,66px)}
    .certificate .ending-copy{font-size:clamp(14px,2vw,18px);line-height:2}
    .certificate .share{color:#28251e;background:rgba(255,252,242,.62)}
    .certificate:after{content:"認 定";position:absolute;right:11.4%;bottom:10.8%;width:13.5%;aspect-ratio:1;
      display:grid;place-items:center;color:rgba(138,52,52,.74);transform:rotate(-7deg);font-family:var(--serif);
      font-size:clamp(11px,2vw,19px);letter-spacing:.08em}
    .share-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:34px}
    .share{display:inline-block;text-decoration:none;border:1px solid var(--line-dark);padding:13px 20px;font-size:12px}
    .share:hover,.share:focus-visible{background:#28343b;color:#fff}
    .site-footer{border-top:1px solid var(--line-dark);border-bottom:1px solid var(--line-dark);padding:24px 14px;margin-bottom:14px;
      display:flex;justify-content:center;gap:18px;align-items:center;color:var(--muted);font-size:11px;text-align:center}
    .fiction-icon{font-family:var(--serif);font-size:20px}
    .noise{position:fixed;inset:0;pointer-events:none;z-index:20;opacity:0;background:
      repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0,rgba(0,0,0,.13) 1px,transparent 1px,transparent 3px);
      mix-blend-mode:multiply}
    body.stage-1 .noise{opacity:.045;animation:noisePulse 7s steps(2,end) infinite}
    body.stage-2{
      --ink:#f1eee7;--muted:#c8c4bb;--line:#6d7071;--line-dark:#9a9c99;
      --paper-2:#252727;--red:#db777c;--red-dark:#f0a1a5;
      background-color:#171919;color:var(--ink)
    }
    body.stage-2 .site-header,body.stage-2 .site-footer,body.stage-2 .utility,body.stage-2 .portal-head,
    body.stage-2 .rule-card,body.stage-2 .item-card,body.stage-2 .record-id,body.stage-2 .result-box{border-color:#5e5553}
    body.stage-2 .item-card,body.stage-2 .rule-card{background:rgba(18,18,18,.54)}
    body.stage-2 .thumb,body.stage-2 .item-visual{background-color:#222}
    body.stage-2 .brand-mark{color:#e8e4da;border-color:#a7adae;background:rgba(255,255,255,.05)}
    body.stage-2 .text-button,body.stage-2 .back,body.stage-2 .progress,body.stage-2 .eyebrow,
    body.stage-2 .brand-sub,body.stage-2 .doc-meta,body.stage-2 .card-id,body.stage-2 .image-pending,
    body.stage-2 .slot-meta,body.stage-2 .modal-back{color:#cbc8c0}
    body.stage-2 .result-box.correct{color:#c8e4d1}
    body.stage-2 .result-box.failure{color:#f0b0b4}
    body.stage-2 .secondary,body.stage-2 .choice,body.stage-2 .tiny,body.stage-2 .menu-choice,
    body.stage-2 .share{border-color:#989b98;color:#f1eee7;background:rgba(255,255,255,.04)}
    body.stage-2 .modal{background:#242626;color:#f1eee7;border-color:#9a9c99}
    body.stage-2 .modal-backdrop{background:rgba(0,0,0,.72)}
    body.stage-2 .addition-note{background:rgba(20,20,20,.72)}
    body.stage-2 .addition-note span{color:#f0a1a5}
    body.stage-2 .noise{opacity:.11;animation:noisePulse 2.2s steps(2,end) infinite}
    body.stage-2:after{content:"";position:fixed;right:3.5vw;top:12vh;width:clamp(170px,29vw,300px);height:clamp(245px,45vw,410px);
      pointer-events:none;z-index:3;opacity:.43;background:url("assets/bloody-handprint.png") center/contain no-repeat;
      filter:drop-shadow(0 0 9px rgba(86,0,8,.45));transform:rotate(-7deg);animation:handPresence 8s ease-in-out infinite}
    body.detail-seal .item-visual:after{content:"";position:absolute;inset:-20%;background:radial-gradient(circle,rgba(116,18,24,.28),transparent 62%);
      animation:mist 5s ease-in-out infinite}
    body.detail-dispose .item-visual:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 8px,rgba(0,0,0,.07) 9px);
      opacity:.24;animation:scan 4s linear infinite}
    body.flash-correct:before,body.flash-wrong:before,body.flash-critical:before{content:"";position:fixed;inset:0;z-index:50;pointer-events:none}
    body.flash-correct:before{background:#fff;animation:flash .7s ease-out forwards}
    body.flash-wrong:before{background:
      repeating-linear-gradient(0deg,rgba(0,0,0,.88) 0 2px,transparent 2px 7px),
      linear-gradient(90deg,transparent 0 18%,rgba(255,255,255,.8) 18% 23%,transparent 23% 61%,#000 61% 74%,transparent 74%);
      animation:glitchOverlay .92s steps(2,end) forwards}
    body.flash-critical:before{background:
      repeating-linear-gradient(0deg,rgba(126,0,8,.95) 0 3px,#090909 3px 7px,transparent 7px 11px),
      linear-gradient(90deg,#050505 0 12%,transparent 12% 37%,rgba(150,0,10,.94) 37% 61%,transparent 61%);
      animation:glitchOverlay 1.12s steps(2,end) forwards}
    body.flash-wrong:after,body.flash-critical:after{content:"";position:fixed;left:-8%;right:-8%;top:0;height:18%;z-index:51;pointer-events:none;
      background:rgba(255,255,255,.78);mix-blend-mode:difference;animation:tearBand .92s steps(1,end) forwards}
    body.flash-critical:after{height:26%;background:rgba(143,0,9,.92);mix-blend-mode:screen;animation-duration:1.12s}
    body.flash-wrong #app{animation:screenJolt .92s steps(2,end)}
    body.flash-critical #app{animation:screenRupture 1.12s steps(2,end);filter:contrast(1.8) saturate(.35)}
    .modal-backdrop{position:fixed;inset:0;background:rgba(24,26,27,.55);display:grid;place-items:center;z-index:100;padding:20px}
    .modal{width:min(700px,100%);background:var(--paper-2);color:var(--ink);border:1px solid var(--line-dark);padding:28px;box-shadow:0 20px 70px rgba(0,0,0,.3)}
    .modal-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:18px}
    .modal h2{font-size:28px;margin:0}
    .close{border:0;background:transparent;font-size:24px;cursor:pointer}
    .slots{display:grid;gap:10px}
    .menu-list{display:grid;gap:10px}
    .menu-choice{width:100%;border:1px solid var(--line-dark);background:rgba(255,255,255,.2);padding:17px 18px;cursor:pointer;
      display:flex;justify-content:space-between;align-items:center;text-align:left;font-family:var(--serif);font-size:17px}
    .menu-choice:hover,.menu-choice:focus-visible{background:#303b42;color:#fff}
    .menu-choice.danger{color:var(--red-dark)}
    .modal-back{border:0;background:transparent;padding:0 0 15px;cursor:pointer;color:var(--muted);font-size:12px}
    .slot{border:1px solid var(--line);padding:15px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
    .slot-name{font-family:var(--serif);font-weight:600}
    .slot-meta{font-size:11px;color:var(--muted);margin-top:5px}
    .slot-actions{display:flex;gap:7px}
    .tiny{border:1px solid var(--line-dark);background:transparent;padding:8px 12px;cursor:pointer;font-size:10px}
    .tiny:hover,.tiny:focus-visible{background:#303b42;color:#fff}
    .tiny:disabled{opacity:.35;cursor:not-allowed;background:transparent;color:inherit}
    @keyframes noisePulse{0%,92%,100%{transform:translate(0);opacity:.04}93%{transform:translateX(5px);opacity:.18}95%{transform:translateX(-3px);opacity:.07}}
    @keyframes handPresence{0%,100%{opacity:.39;filter:drop-shadow(0 0 7px rgba(86,0,8,.35))}50%{opacity:.48;filter:drop-shadow(0 0 12px rgba(112,0,10,.52))}}
    @keyframes mist{0%,100%{transform:scale(1);opacity:.4}50%{transform:scale(1.1);opacity:.75}}
    @keyframes scan{to{transform:translateY(18px)}}
    @keyframes flash{0%{opacity:.85}100%{opacity:0}}
    @keyframes glitchOverlay{
      0%{opacity:1;transform:translate(0)}
      12%{opacity:.25;transform:translateX(9%)}
      25%{opacity:.95;transform:translateX(-6%) scaleX(1.08)}
      42%{opacity:.15;transform:translateX(3%)}
      58%{opacity:.9;transform:translateX(-11%)}
      76%{opacity:.45;transform:translateX(7%)}
      100%{opacity:0;transform:translate(0)}
    }
    @keyframes tearBand{
      0%{top:6%;transform:translateX(-13%) skewX(18deg)}
      18%{top:68%;transform:translateX(20%) skewX(-12deg)}
      37%{top:31%;transform:translateX(-9%) scaleY(.35)}
      55%{top:82%;transform:translateX(14%) scaleY(1.4)}
      74%{top:16%;transform:translateX(-18%) scaleY(.55)}
      100%{top:50%;opacity:0;transform:translateX(0) scaleY(.1)}
    }
    @keyframes screenJolt{
      0%,100%{transform:translate(0);filter:none}
      15%{transform:translate(-13px,4px) skewX(1deg);filter:contrast(2) grayscale(1)}
      31%{transform:translate(17px,-5px) skewX(-2deg)}
      48%{transform:translate(-8px,7px) scaleX(1.015);filter:invert(1)}
      66%{transform:translate(11px,-3px)}
      84%{transform:translate(-4px,2px);filter:contrast(2.4)}
    }
    @keyframes screenRupture{
      0%,100%{transform:translate(0)}
      10%{transform:translate(-20px,8px) skewX(3deg)}
      22%{transform:translate(25px,-9px) scaleX(1.03)}
      36%{transform:translate(-16px,-4px) skewX(-4deg)}
      51%{transform:translate(19px,11px) scaleY(.98)}
      67%{transform:translate(-11px,-7px) skewX(2deg)}
      83%{transform:translate(8px,4px) scaleX(1.015)}
    }
    @media(max-width:850px){
      .shell{width:min(100% - 24px,1240px)}.doc-meta{display:none}.site-header{padding:13px 8px}.brand-mark{width:44px;height:44px}
      main{padding:36px 10px 55px}.rules,.grid{grid-template-columns:1fr}.rule-card{min-height:105px}.start-row,.record-layout{grid-template-columns:1fr}
      .stamp{display:none}.portal-head{align-items:start;flex-direction:column}.item-card{min-height:260px}.thumb{height:145px}.item-visual{min-height:330px}
      .choices{grid-template-columns:1fr}.site-footer{font-size:9px}.utility{padding-right:4px}
      .certificate{padding:64px 34px 82px;min-height:0}.certificate .ending-copy{line-height:1.85}
    }
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <div id="app"></div>
  <script>window.__ITEMS__=[{"id":1,"title":"長い髪の日本人形","content":"廃屋で見つかった長い髪の日本人形。\n廃屋を探索していた動画配信者が発見、保持。\n「見られているような気がする」と鑑定に出された。","after":"戦時中、出征する父親が娘の無事を願って贈った日本人形。\n\n終戦後、生き延びた父親が故郷へ戻ると、家は焼け落ち、家族の姿もなかった。ただ、瓦礫の中にこの人形だけが残されていたという。\n\n娘を見つけられなかった父親の無念が宿り、持ち主を娘と思い込んで見守り続けていた。\n\n供養の後、人形は適切に処分された。伸び続けていた髪も、すべて灰になった。","failure":"誤った処置によって、人形に宿る思念は強まった。\n\n保管場所から人形が消えた翌日、発見者である動画配信者が新しい動画を公開した。\n\nその背後には、長い髪の人形が立っていた。","correct":"dispose","scores":{"none":2,"dispose":0,"seal":1}},{"id":2,"title":"干からびた河童の手のようなもの","content":"とある神社近くで見つかった干からびた河童の手のようなもの。\n散歩中の学生が発見した。\n「もしかしたら一攫千金かも」と鑑定に出された。","after":"河童の手ではなく、昭和初期に見世物用として作られた模造品。\n\n乾燥させた動物の皮と魚の骨を組み合わせたもので、\n旅回りの興行師が神社へ奉納したものと思われる。\n\n呪力および霊的な反応は確認されなかった。","failure":"呪物として扱われたことで、人々の恐怖が物品に定着した。\n\n処置の翌朝、依頼者の部屋には小さな濡れた足跡が残されていた。\n\n干からびていたはずの指は、一本だけ内側へ曲がっていたという。","correct":"none","scores":{"none":0,"dispose":1,"seal":2}},{"id":3,"title":"長い髪が編み込まれ、血濡れの藁人形","content":"人気のない神社裏の木に、釘で打ち込まれていた藁人形。\n藁人形には長い髪が編み込まれており、血のようなもので濡れている。\n「時々脈打っているような気がする」と鑑定に出された。","after":"編み込まれた髪は、現在も生存している女性のものと判明した。\n\n付着していた血液は、呪いを行った人物のもの。\n脈打つような動きは、呪いを受けた女性の心拍と連動していた。\n\n封印後、女性を苦しめていた原因不明の体調不良は回復した。\n\n藁人形は現在も封印指定物として保管されている。","failure":"藁人形を打ち付けていた釘が、誰も触れていないにもかかわらず抜け落ちた。\n\n翌朝、編み込まれていた髪が別人のものへ変化していた。\n\n新しい対象は、この物品の処置を決定した人物である。","correct":"seal","scores":{"none":2,"dispose":1,"seal":0}},{"id":4,"title":"古びたおもちゃの箱","content":"とあるアパートで見つかったブリキのおもちゃ箱。\n懐かしいおもちゃなどが中に納められている。\n「遺品整理で見つかった。念のため鑑定したい」と鑑定に出された。","after":"亡くなった所有者が、幼少期から大切に保管していたおもちゃ箱。\n\n所有者は壊れたおもちゃを修理し、\n近所の子供たちへ譲る活動をしていたという。\n\n箱に残されていたのは穏やかな記憶だけで、呪力は確認されなかった。","failure":"必要のない処置によって、箱の中に残されていた記憶が歪められた。\n\n処分したはずのおもちゃ箱は、\n翌朝、依頼者の玄関前に置かれていた。\n\n箱の中には、依頼者によく似た新しい人形が加わっていた。","correct":"none","scores":{"none":0,"dispose":1,"seal":2}},{"id":5,"title":"どす黒い染みがついたハイヒール","content":"何かしらの染みがついたハイヒール。\n「持っていると水にぬれた足音が聞こえる」と鑑定に出された。","after":"雨の夜に起きたひき逃げ事件の被害者が履いていたハイヒール。\n\n片方は遺体とともに発見されたが、\nもう片方は長い間、行方不明になっていた。\n\n付着していた染みは血液と泥水が混ざったもの。\n持ち主の「家に帰りたい」という思念が残されていた。\n\n適切な処分後、水に濡れた足音は聞こえなくなった。","failure":"依頼者の部屋に、濡れた足跡が現れるようになった。\n\n足跡は日を追うごとに寝室へ近づき、\n五日目の朝にはベッドの横で途切れていた。\n\nその日から、ハイヒールの所在は分からなくなっている。","correct":"dispose","scores":{"none":2,"dispose":0,"seal":1}},{"id":6,"title":"千切れた御札","content":"バラバラに千切れた御札のようなもの。\n祠のような場所の近くで発見された。\n「何か危険かも」と鑑定に出された。","after":"災厄を封じていた御札ではなく、持ち主の身代わりとなった護符。\n\n数年前、祠の近くで起きた落石事故から参拝者を守った際に、\n自然に千切れたものと考えられる。\n\n既に役目を終えており、危険性はない。","failure":"御札を呪物として扱ったことで、\n護符に残されていた力が反転した。\n\nバラバラだった紙片は、処置後にひとりでに繋がっていた。\n\nただし、御札に書かれていた文字はすべて逆さまになっていた。","correct":"none","scores":{"none":0,"dispose":1,"seal":2}},{"id":7,"title":"片目だけが黒く塗られた狐面","content":"祭りの露店で購入された狐面。\n夜になると、塗られていない方の目が動くという。\n「実害はないが薄ら寒い」と鑑定に出された。","after":"かつて神社から持ち出され、露店へ流れた奉納用の狐面。\n\n黒く塗られた目には「見てはならないものを封じる」という意味があった。\n\n長年、多くの人間に覗き込まれたことで弱い呪力を帯びていたが、\n適切な処分によって消失した。","failure":"処置後、狐面の両目から黒い塗りが消えた。\n\n翌朝、依頼者は片方の目が見えないと訴えたが、医学的な異常は発見されなかった。\n\n狐面は保管場所から消えている。","correct":"dispose","scores":{"none":2,"dispose":0,"seal":1}},{"id":8,"title":"歯形がついているように見える朱塗りの櫛","content":"河原で拾われた古い櫛。\n歯形に見える跡は、当時のデザインのようだ。\n「この歯形は明らかに怪しい」と鑑定に出された。","after":"歯形に見えた跡は、流水を表現した古い装飾だった。\n\nかつて嫁入り道具として作られたもので、\n洪水によって持ち主の家から流出したと考えられる。\n\n人の歯形や血液、呪力などは確認されなかった。","failure":"処置後、櫛に残されていた模様が本物の歯形へ変化した。\n\n依頼者が櫛を捨てても、翌朝には必ず枕元へ戻ってくるという。\n\n櫛には毎晩、長い髪が絡まっている。","correct":"none","scores":{"none":0,"dispose":1,"seal":2}},{"id":9,"title":"逆さに文字が刻まれた位牌","content":"孤独死を迎えた方の家屋で見つかった位牌。\n「所持していると常に『死ななければ』と思ってしまう」と鑑定に出された。","after":"人間の生への執着を弱め、自ら死を選ばせるために作られた逆さ位牌。\n\n刻まれた文字は削られているが、複数人の死亡に関与した可能性が高い。\n\n封印後、依頼者を苦しめていた希死念慮は消失した。\n\n位牌は封印指定物として厳重に保管されている。","failure":"位牌に刻まれていた文字が、正しい向きへ戻った。\n\nそこには、依頼者の名前が刻まれていた。\n\n依頼者とは現在も連絡が取れていない。","correct":"seal","scores":{"none":2,"dispose":1,"seal":0}},{"id":10,"title":"鳴らない南部鉄器の風鈴","content":"引っ越しに伴い持ち込まれた南部鉄器の風鈴。\n風を当てても鳴らないが、夜中の2時ごろに風もないのに音を立てるらしい。\n「この音を聞くと不安になる」と鑑定に出された。","after":"病床にあった女性が、夜勤から帰る息子を迎えるために使っていた風鈴。\n\n女性が亡くなった時刻は、午前二時頃だったという。\n\n息子を待ち続ける弱い思念が残されていたが、\n適切な処分によって音は聞こえなくなった。","failure":"風鈴の音は、以前よりも大きくなった。\n\n依頼者が風鈴を手放した後も、毎晩午前二時になると耳元で音が鳴るという。\n\n最近では、音に混じって女性の声も聞こえるらしい。","correct":"dispose","scores":{"none":2,"dispose":0,"seal":1}},{"id":11,"title":"赤い糸で口を縫われたお守り","content":"古いお守り。\n中には髪の毛と米粒が入っている。\n\n「持っていると安心するけど、少し不安」と鑑定に出された。","after":"古い地方で作られていた安産祈願のお守り。\n\n髪の毛は母親のもの、米粒は生まれてくる子供が、\n食べ物に困らないよう納められたものだった。\n\n赤い糸には、災いがお守りの中へ入らないよう入口を閉じる意味がある。\n\n呪力は確認されなかった。","failure":"処置の途中で、口を縫っていた赤い糸が切れた。\n\nその夜から、依頼者の部屋で子守歌が聞こえるようになった。\n\n歌が終わるたび、枕元に落ちている髪の毛が増えているという。","correct":"none","scores":{"none":0,"dispose":1,"seal":2}},{"id":12,"title":"焦げ跡のある花嫁簪","content":"火災現場から見つかった簪。\n見る人を引き付ける不思議な魅力がある。\n\n「所持者の周りで不審火が多発する」と鑑定に出された。","after":"婚礼当日の火災で亡くなった花嫁が身につけていた簪。\n\n花嫁が最期に抱いた「すべて燃えてしまえ」という強い憎悪が宿っている。\n\n簪に魅了された者は手放すことができなくなり、\n周囲で火災を引き起こしていた。\n\n封印後、不審火は発生していない。","failure":"依頼者の自宅で火災が発生した。\n\n室内は全焼したが、焦げ跡のある簪だけは無傷の状態で発見された。\n\n簪は現在、再び所在不明となっている。","correct":"seal","scores":{"none":2,"dispose":1,"seal":0}},{"id":13,"title":"片方だけの子供用の下駄","content":"廃屋の玄関に残されていた小さな下駄。\n一つだけで残されていたものを愛好家が保持していた。\n\n「部屋にいるのに雨音が近く聞こえる」と鑑定に出された。","after":"大雨による洪水で行方不明になった子供の下駄。\n\n家へ帰ろうとする思念だけが下駄に残り、雨音や濡れた足跡を発生させていた。\n\n供養の後に適切な処分を行ったことで、廃屋周辺の怪異は収まった。","failure":"依頼者の家に、小さな濡れた足跡が現れた。\n\n足跡は玄関から子供部屋へ続き、布団の中で途切れていた。\n\n保管していた下駄は、いつの間にかなくなっていた。","correct":"dispose","scores":{"none":2,"dispose":0,"seal":1}},{"id":14,"title":"海水に濡れた白い産着","content":"海岸に流れ着いていた白い産着。\n常に湿っており、乾くことはない。\n\n「近くで眠ると、海中に沈む夢を見る」と鑑定に出された。","after":"亡くなった子供を海から呼び戻すための儀式に使用された産着。\n\n儀式は失敗し、産着には子供ではない何かが入り込んだ。\n\n近くで眠った人間に海の夢を見せ、少しずつ水中へ誘い込む性質を持つ。\n\n現在は特殊な容器に収められ、封印されている。","failure":"依頼者が自宅の寝室で死亡しているのが発見された。\n\n室内に水はなかったが、\n肺の中は海水で満たされていた。\n\n白い産着は、発見時には完全に乾いていたという。","correct":"seal","scores":{"none":2,"dispose":1,"seal":0}},{"id":15,"title":"何かが詰まった瓢箪","content":"とある民家の押し入れで見つかった瓢箪。\n振ると赤ちゃんの声のような音がする。\n\n「廃棄予定だが、廃棄前に」と鑑定に出された。","after":"内部に入っていたのは、乾燥した瓢箪の種と細い竹片。\n\n振った際に竹片へ空気が通り、赤ん坊の声に似た音を発していた。\n\nかつて子供をあやすために作られた、手製のおもちゃと考えられる。\n\n呪力は確認されなかった。","failure":"処置後、瓢箪の中から本物の泣き声が聞こえるようになった。\n\n日を追うごとに瓢箪は重くなり、\n現在は大人一人では持ち上げられないという。\n\n内部では、何かが爪を立て続けている。","correct":"none","scores":{"none":0,"dispose":1,"seal":2}},{"id":16,"title":"十三枚の寛永通宝","content":"紐で一括りになっている寛永通宝の束。\n普通の物品鑑定と間違えて持ち込まれた。\n\n「捨てても翌朝には戻ってくる。あと少しずつ近づいてくる。霊験あらたかなの！」と鑑定に出された。","after":"墓から持ち出された十三枚の副葬品。\n\n紐で一つに束ねられたことで、元の場所へ戻ろうとする思念が強まり、\n持ち主の元へ繰り返し現れていた。\n\n十三枚を切り離し、それぞれ個別に処分したことで怪異は収まった。","failure":"翌朝、十三枚の寛永通宝が依頼者の枕元に並んでいた。\n\nその翌日は布団の上、\nその次の日には胸元へ移動していたという。\n\n十三日目、\n硬貨は依頼者の口の中から発見された。","correct":"dispose","scores":{"none":2,"dispose":0,"seal":1}},{"id":17,"title":"鋭利な和鋏","content":"錆もなく、とても鋭利な和鋏。\n所有者は、手入れなどは一切していないという。\n\n「これを入手してから夢遊病になった気がする」と鑑定に出された。","after":"かつて複数人を殺害した仕立屋が使用していた和鋏。\n\n持ち主が眠っている間に身体を操り、\n再び人を傷つけようとする強い呪力を持つ。\n\n封印後、依頼者の夢遊症状は完全に治まった。\n\n鋏は刃を閉じた状態で封印されている。","failure":"依頼者は毎朝、\n鏡の前で和鋏を握った状態で目を覚ますようになった。\n\n最初は髪の毛だけだったが、\nやがて刃には血液が付着するようになった。\n\nそれが誰の血液なのかは判明していない。","correct":"seal","scores":{"none":2,"dispose":1,"seal":0}},{"id":18,"title":"名前が書かれた千代紙","content":"依頼者の家の箪笥の裏から見つかった、裏面に多数の名前がある千代紙。\n\n「気味が悪い。呪いだったらどうしよう」と鑑定に出された。","after":"かつてこの家で営まれていた呉服店の顧客名簿。\n\n注文を受けた反物の柄と顧客の名前を、千代紙の裏へ記録していたものだった。\n\n記載された人物の多くは既に亡くなっているが、呪術的な意味はない。","failure":"処置後、\n千代紙に書かれていた名前がすべて消えた。\n\n代わりに、依頼者とその家族の名前が記されていた。\n\n名前は一日に一人ずつ消えている。","correct":"none","scores":{"none":0,"dispose":1,"seal":2}},{"id":19,"title":"首のない木彫りの地蔵","content":"古民家カフェの裏庭から見つかった、首部分が割れた小さな地蔵。\n\n「見守ってくれている気がするが、気味が悪い」と鑑定に出された。","after":"古民家の住人を長年見守っていた身代わり地蔵。\n\n過去に庭の石垣が崩れた際、落石を受けて首が割れたものと考えられる。\n\n災厄を招くものではなく、既に一度、住人を災いから守った存在だった。","failure":"地蔵を処置してから、\n店内で小さな事故が相次ぐようになった。\n\nある朝、なくなっていたはずの地蔵の頭部が、カフェのテーブルに置かれていた。\n\nその顔は、店の入口を睨んでいたという。","correct":"none","scores":{"none":0,"dispose":1,"seal":2}},{"id":20,"title":"腹の中で音がする招き猫","content":"匿名で持ち込まれた、不気味な雰囲気の招き猫。\n振るとカチカチと、何かがぶつかる音がする。\n\n「持っていると力が抜ける気がする」と鑑定に出された。","after":"招き猫の内部から、十二本の人間の歯が発見された。\n\n所有者の生命力を吸い取り、\n死亡するたびに歯を一本ずつ取り込んでいたと考えられる。\n\n封印後、内部から聞こえていた音は止まり、\n招き猫の笑顔部分に大きな亀裂が入った。","failure":"依頼者の歯が、原因不明のまま一本抜け落ちた。\n\n抜けた歯は見つからなかったが、招き猫を振ると、以前より一つ多く音が鳴ったという。\n\n翌日、招き猫は依頼者とともに姿を消した。","correct":"seal","scores":{"none":2,"dispose":1,"seal":0}},{"id":21,"title":"呪物鑑定に使われた端末","content":"本鑑定に使われていた端末。\n\n呪物が登録されると、ひとりでに起動する。","after":"この端末は、鑑定した呪物から漏れ出した呪力を記録とともに蓄積していた。\n\n呪物が登録されるたびにひとりでに起動していたのは、端末そのものが次の所有者を探していたためと考えられる。\n\n封印処置によって、端末と鑑定者との接続は切断された。\n\n画面には最後に「鑑定者情報を削除しました」と表示された。","failure":"選択を受理した直後、端末が再起動した。\n\n鑑定サイトには、存在しないはずの二十二件目が登録されていた。\n\n物品名は「鑑定者」。\n\n添付された画像には、画面を覗き込んでいる人物の姿が映っていた。","correct":"seal","scores":{"none":2,"dispose":1,"seal":0}}];</script>

          18:"assets/object-18-named-chiyogami.png",
          19:"assets/object-19-headless-wooden-jizo.png",
          20:"assets/object-20-rattling-maneki-neko.png",
          21:"assets/object-21-appraisal-terminal.png"
        };
        return item?images[item.id]||"":"";
      }
      function stage(){
        if(state.score>=11)return 2;
        if(state.score>=6)return 1;
        return 0;
      }
      function corruptText(value,severity,salt){
        var broken=[" ","縺","譁","螟","蜈","荳","逕","莠","謇","髫"];
        var interval=severity===1?19:9;
        return String(value).split("").map(function(ch,index){
          if(!/[A-Za-z0-9\u3040-\u30ff\u3400-\u9fff]/.test(ch))return ch;
          var seed=ch.charCodeAt(0)+index*31+salt*17+state.score*13;
          return seed%interval===0?broken[seed%broken.length]:ch;
        }).join("");
      }
      function applyCorruption(){
        if(state.view==="ending")return;
        var severity=stage();
        if(severity===0)return;
        var targets=document.querySelectorAll(
          ".brand-name,.brand-sub,.eyebrow,main h1,main h2,main h3,.lead,.detail-copy>.story-text,.registry-count,.record-id,.card-id,.progress"
        );
        targets.forEach(function(element,elementIndex){
          if(element.closest(".modal,.result-box"))return;
          var walker=document.createTreeWalker(element,NodeFilter.SHOW_TEXT);
          var node;
          while((node=walker.nextNode())){
            node.nodeValue=corruptText(node.nodeValue,severity,elementIndex);
          }
        });
      }
      function header(){
        return '<div class="shell"><header class="site-header"><div class="brand"><div class="brand-mark" aria-hidden="true">鑑</div>'+
          '<div><div class="brand-name">文化資料保全・呪物対策研究室</div><div class="brand-sub">文化資料調査室　オンライン受付係</div></div></div>'+
          '<div class="doc-meta">文書番号：BCA-OC-2026-0726<br>改訂版：第1.0版<br>運用区分：鑑定実務</div></header>'+
          '<div class="utility"><button class="text-button menu-button" onclick="ocs.openMenu()" aria-label="メニューを開く"><span class="menu-icon">☰</span><span>メニュー</span></button></div><main>';
      }
      function footer(){
        return '</main><footer class="site-footer"><span class="fiction-icon" aria-hidden="true">▥</span>'+
          '<span>このWebサイトの内容はフィクションです。実在の人物・団体とは関係ありません。</span></footer></div>';
      }
      function intro(){
        return '<section><div class="eyebrow">ONLINE CURSED OBJECT APPRAISAL / REGISTRATION DESK</div>'+
          '<h1>オンライン呪物鑑定受付</h1><p class="lead">登録された物品の来歴および現象を確認し、適切な処置を選択してください。</p>'+
          '<div class="rules"><article class="rule-card"><div class="rule-icon">✓</div><div><h3>問題なし</h3><p>呪物ではなく、<br>今後も被害をもたらさない物品。</p></div></article>'+
          '<article class="rule-card"><div class="rule-icon">廃</div><div><h3>破棄する</h3><p>弱い呪力を持ち、<br>適切な破棄によって解呪できる物品。</p></div></article>'+
          '<article class="rule-card"><div class="rule-icon">封</div><div><h3>封印する</h3><p>危険性が高く、<br>直ちに封印措置を必要とする物品。</p></div></article></div>'+
          '<p class="story-text">呪物、もしくは呪物と思われるものには適切な対応をしてください。<br>不適切な処置を行った場合、呪物ではないものは呪力を帯び、呪物はさらに強大な呪力を得ます。</p>'+
          '<div class="start-row"><button class="primary" onclick="ocs.start()"><span>▤　鑑定を開始する</span><span>〉</span></button>'+
          '<div class="registry-count">現在の登録物品：3件</div></div><div class="stamp">鑑定受付</div></section>';
      }
      function portal(){
        var count=answeredCount();
        var visible=Math.min(21,3+Math.floor(count/3)*3);
        var cards=ITEMS.slice(0,visible).map(function(item){
          var done=!!state.answers[item.id];
          var image=itemImage(item);
          return '<button class="item-card '+(done?"done":"")+'" onclick="ocs.item('+item.id+')">'+
            (done?'<span class="done-label">対応済み</span>':'')+
            '<div class="thumb '+(image?"has-image":"")+'">'+
            (image?'<img src="'+image+'" alt="" loading="lazy">':'<span class="thumb-no">'+String(item.id).padStart(2,"0")+'</span><span class="image-pending">資料画像・差替予定</span>')+'</div>'+
            '<div class="card-copy"><div class="card-id">REG-'+String(item.id).padStart(3,"0")+'</div><h3>'+esc(item.title)+'</h3></div></button>';
        }).join("");
        var note=visible<21?'<div class="unlock-note">現在表示中の物品への対応を完了すると、次の登録資料が開示されます。</div>':"";
        var addition=unlockNotice?'<div class="addition-note"><strong>新しい鑑定物品が登録されました。</strong><span>登録物品 ＋'+unlockNotice+'件</span></div>':"";
        return '<section><div class="portal-head"><div><div class="eyebrow">REGISTERED OBJECTS</div><h2>呪物鑑定ポータル</h2></div>'+
          '<div class="progress">現在の登録物品 '+visible+'件　／　対応済み '+count+'件</div></div>'+addition+'<div class="grid">'+cards+'</div>'+note+'</section>';
      }
      function detail(){
        var item=ITEMS.find(function(x){return x.id===state.selected;});
        if(!item){state.view="portal";return portal();}
        var image=itemImage(item);
        var answer=state.answers[item.id];
        var choices=Object.keys(LABELS).map(function(choice){
          return '<button class="choice" '+(answer?"disabled":"")+' onclick="ocs.answer('+item.id+',\''+choice+'\')">'+LABELS[choice]+'</button>';
        }).join("");
        var result="";
        if(answer){
          var correct=answer.points===0;
          result='<div class="result-box '+(correct?"correct":"failure")+'"><span class="result-label">'+(correct?"処置完了":"処置後経過")+'</span>'+
            '<div class="story-text">'+nl(correct?item.after:item.failure)+'</div>'+
            '<div class="result-actions"><button class="secondary" onclick="ocs.portal()">一覧へ戻る</button></div></div>';
        }
        return '<section class="detail"><button class="back" onclick="ocs.portal()">〈 鑑定ポータルへ戻る</button>'+
          '<div class="record-layout"><div class="item-visual '+(image?"has-image":"")+'"><span class="specimen-mark">REGISTERED MATERIAL</span>'+
          (image?'<img src="'+image+'" alt="'+esc(item.title)+'">':'<span class="visual-no">'+String(item.id).padStart(2,"0")+'</span><span class="image-pending">資料画像・差替予定</span>')+'</div>'+
          '<div class="detail-copy"><div class="record-id">登録番号 REG-'+String(item.id).padStart(3,"0")+' / 受付済</div><h1>'+esc(item.title)+'</h1>'+
          '<div class="story-text">'+nl(item.content)+'</div>'+
          (answer?"":'<div class="choices" aria-label="処置を選択">'+choices+'</div>')+result+'</div></div></section>';
      }
      function endingData(no){
        if(no===1)return {title:"呪いの暴走",copy:"呪いは暴走し、溢れた。\n\n溢れた呪いは、人を伝い、物を伝い、拡がっていく",share:"呪いは伝播する",cert:false};
        if(no===2)return {title:"特級呪物鑑定士",copy:"貴方は類稀な呪物の鑑定能力を示されました。\nここに、特級呪物鑑定士として認定いたします。\n\nこれからも、鑑定のほど、よろしくお願いいたします。",share:"今日から特級呪物鑑定士",cert:true};
        if(no===3)return {title:"上級呪物鑑定士",copy:"貴方は呪物の鑑定において、素晴らしい能力を示されました。\nここに、上級呪物鑑定士として認定いたします。\n\n一部の呪物に関しては、私共の方で処理しておきましたので、\nご安心くださいませ。",share:"上級呪物鑑定士になりました。",cert:true};
        return {title:"駆け出し呪物鑑定士",copy:"貴方は呪物の鑑定において、推定以上の能力を示されました。\nこれからも呪物鑑定士として、\n尽力いただけることを期待します。\n\n貴方が取り逃した呪物に関しては、\n私共の方で処理しておきましたので、ご安心くださいませ。",share:"呪物鑑定士の見習いになりました。",cert:false};
      }
      function ending(){
        var data=endingData(state.ending||1);
        var share="https://twitter.com/intent/tweet?text="+encodeURIComponent(data.share+"\n#オンライン呪物鑑定サイト")+"&url="+encodeURIComponent("https://note.com/mei_takanashi/n/n7fac43348669");
        return '<section class="ending '+(data.cert?"certificate":"")+'"><div class="ending-code">APPRAISAL RESULT / RECORD CLOSED</div>'+
          '<h1>'+esc(data.title)+'</h1><div class="ending-copy">'+nl(data.copy)+'</div>'+
          '<div class="share-row"><a class="share" target="_blank" rel="noopener" href="'+share+'">Xでシェア</a></div></section>';
      }
      function slotRows(mode){
        return [1,2,3].map(function(slot){
          var data=readSlot(slot);
          var count=data?Object.keys(data.answers||{}).length:0;
          var meta=data?(count?("鑑定済み "+count+"件"):"鑑定開始前"):"未使用";
          if(data&&data.ending)meta+="・結果記録あり";
          return '<div class="slot"><div><div class="slot-name">スロット '+slot+'</div><div class="slot-meta">'+meta+'</div></div>'+
            '<div class="slot-actions"><button class="tiny" '+(mode==="load"&&!data?"disabled":"")+
            ' onclick="ocs.'+(mode==="save"?"saveSlot":"loadSlot")+'('+slot+')">'+(mode==="save"?"ここに保存":"読み込む")+'</button></div></div>';
        }).join("");
      }
      function slotModal(){
        if(!modalOpen)return "";
        var title=modalMode==="save"?"セーブ":modalMode==="load"?"ロード":"メニュー";
        var content=modalMode==="menu"?
          '<div class="menu-list"><button class="menu-choice" onclick="ocs.menuMode(\'save\')"><span>セーブ</span><span>〉</span></button>'+
          '<button class="menu-choice" onclick="ocs.menuMode(\'load\')"><span>ロード</span><span>〉</span></button>'+
          '<button class="menu-choice danger" onclick="ocs.restart()"><span>最初から</span><span>↻</span></button></div>':
          '<button class="modal-back" onclick="ocs.menuMode(\'menu\')">〈 メニューへ戻る</button><div class="slots">'+slotRows(modalMode)+'</div>';
        return '<div class="modal-backdrop" onclick="ocs.backdrop(event)"><div class="modal" role="dialog" aria-modal="true" aria-label="保存データ">'+
          '<div class="modal-head"><h2>'+title+'</h2><button class="close" aria-label="閉じる" onclick="ocs.closeMenu()">×</button></div>'+
          (modalMode==="save"?'<p class="story-text">現在の進捗を保存します。鑑定ポイントも保存データに含まれます。</p>':
          modalMode==="load"?'<p class="story-text">保存時点の鑑定状況から再開します。</p>':"")+content+'</div></div>';
      }
      function bodyClass(){
        var classes=["stage-"+stage()];
        if(state.view==="item"){
          var item=ITEMS.find(function(x){return x.id===state.selected;});
          if(item)classes.push("detail-"+item.correct);
        }
        return classes.join(" ");
      }
      function render(){
        document.body.className=bodyClass();
        var content=state.view==="intro"?intro():state.view==="portal"?portal():state.view==="item"?detail():ending();
        document.getElementById("app").innerHTML=header()+content+footer()+slotModal();
        applyCorruption();
        window.scrollTo({top:0,behavior:"smooth"});
      }
      function flash(points){
        var name=points===0?"flash-correct":points===1?"flash-wrong":"flash-critical";
        document.body.classList.add(name);
        setTimeout(function(){document.body.classList.remove(name);},points===2?1180:980);
      }
      window.ocs={
        start:function(){state.view="portal";render();},
        portal:function(){state.view="portal";state.selected=null;render();},
        item:function(id){unlockNotice=0;state.view="item";state.selected=id;render();},
        answer:function(id,choice){
          if(state.answers[id])return;
          var item=ITEMS.find(function(x){return x.id===id;});
          if(!item||item.scores[choice]==null)return;
          var points=item.scores[choice];
          state.answers[id]={choice:choice,points:points};
          state.score+=points;
          var count=Object.keys(state.answers).length;
          if(count%3===0&&count<21)unlockNotice=3;
          if(state.score>=16){state.ending=1;state.view="ending";state.selected=null;}
          else if(count===21){
            state.ending=state.score===0?2:state.score<=10?3:4;
            state.view="ending";state.selected=null;
          }
          render();flash(points);
        },
        openMenu:function(){modalOpen=true;modalMode="menu";render();},
        closeMenu:function(){modalOpen=false;render();},
        menuMode:function(mode){modalMode=mode;render();},
        backdrop:function(event){if(event.target.classList.contains("modal-backdrop")){modalOpen=false;render();}},
        saveSlot:function(slot){
          if(readSlot(slot)&&!confirm("スロット "+slot+" の保存データを上書きしますか？"))return;
          writeSlot(slot);modalOpen=false;render();
        },
        loadSlot:function(slot){
          var saved=readSlot(slot);
          if(!saved)return;
          if(!confirm("現在の未保存の進捗を破棄し、スロット "+slot+" を読み込みますか？"))return;
          state=saved;unlockNotice=0;modalOpen=false;render();
        },
        restart:function(){
          if(!confirm("現在の進捗を破棄して、最初から始めますか？\n保存済みのデータは削除されません。"))return;
          state=blank();unlockNotice=0;modalOpen=false;render();
        }
      };
      render();
    })();
  </script>
</body>
</html>
